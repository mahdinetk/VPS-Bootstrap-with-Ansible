---
- name: Create Nginx configuration directory
  ansible.builtin.file:
    path: "{{ nginx_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy Nginx virtual host configuration
  ansible.builtin.template:
    src: default.conf.j2
    dest: "{{ nginx_config_dir }}/default.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload Nginx container
